name: Generate docs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, development]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          check-latest: true

      - name: Cache Go build and module downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Generate docs
        run: |
          chmod +x ./generate-docs.sh || true
          ./generate-docs.sh

      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit generated docs
        if: steps.check-changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/
          git commit -m "docs: auto-generate documentation

          Auto-generated by generate-docs.sh workflow"
          git push

      - name: Create or update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          header: docs
          message: |
            ${{ steps.check-changes.outputs.changes == 'true' && '📚 Documentation has been generated and committed to this PR!' || '📚 Documentation is up to date - no changes needed.' }}

            Generated files:
            - docs/html/index.html
            - docs/docs.md

            ${{ steps.check-changes.outputs.changes == 'true' && 'The workflow will re-run automatically to verify the changes.' || '' }}