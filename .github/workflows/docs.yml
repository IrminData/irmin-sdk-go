name: Generate docs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, development]

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          check-latest: true

      - name: Cache Go build and module downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Generate docs
        run: |
          chmod +x ./generate-docs.sh || true
          ./generate-docs.sh

      - name: Upload HTML docs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/html
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Markdown reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-markdown
          path: docs/docs.md
          if-no-files-found: warn
          retention-days: 7

      - name: Create or update PR comment with artifact links
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          header: docs
          message: |
            Docs generated for this PR:

            - HTML bundle: docs-html (download from the PR "Artifacts" section)
            - Markdown: docs-markdown (download from the PR "Artifacts" section)

            Paths produced by the script:
            - docs/html/index.html
            - docs/docs.md

            Note: Artifacts are kept for 7 days.