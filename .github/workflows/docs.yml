name: Generate docs

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, development]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR head ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          check-latest: true

      - name: Cache Go build and module downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Generate docs
        run: |
          bash ./generate-docs.sh

      - name: Check for changes in docs/
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated docs to PR head ref
        if: steps.check-changes.outputs.changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/
          # If nothing to commit (race), skip gracefully
          git commit -m "docs: auto-generate documentation" -m "Auto-generated by generate-docs.sh workflow" || exit 0
          # Push back to the PR head ref (current event ref)
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Create or update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          header: docs
          message: |
            ${{ steps.check-changes.outputs.changes == 'true' && '📚 Documentation has been generated and pushed to this PR branch.' || '📚 Documentation is up to date — no changes needed.' }}

            Generated files:
            - docs/html/index.html
            - docs/docs.md

            ${{ steps.check-changes.outputs.changes == 'true' && 'The workflow re-ran after pushing the docs to verify the changes.' || '' }}