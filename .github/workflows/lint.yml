name: Lint

on:
  pull_request:
    branches: [main, development]

# Prevent concurrent runs of the same workflow on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Set read-only permissions
permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          args: --timeout=5m
          skip-cache: true

      - name: Notify on Failure
        if: failure()
        run: |
          echo "Linting failed! Please check the workflow run for details."
